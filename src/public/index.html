
<!DOCTYPE html>
<html>
<head>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>
</head>
<body style="margin:0;background:#eeeeee;color:#222;font:15px system-ui,sans-serif">
  <model-viewer
    camera-controls
    auto-rotate
    shadow-intensity="1"
    style="width:100vw;height:100vh">
  </model-viewer>
  <div id="status" role="status" style="position:absolute;top:16px;left:16px;pointer-events:none"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const status = document.querySelector('#status');
    const viewer = document.querySelector('model-viewer');
    const background = (params.get('background') || 'eeeeee').replace(/^#/, '');
    if (/^[0-9a-f]{6}$/i.test(background)) document.body.style.backgroundColor = '#' + background;
    const filename = params.get('model');
    if (!filename) status.textContent = 'Specify a model with ?model=part.glb';
    else if (filename.split('/').some(part => !part || part === '.' || part === '..') || /[\\\x00-\x1f]/.test(filename)) {
      status.textContent = 'Use a relative filename within the models folder.';
    } else {
      status.textContent = 'Loading ' + filename + '…';
      viewer.addEventListener('load', () => { status.textContent = filename; });
      viewer.addEventListener('error', () => { status.textContent = 'Unable to load ' + filename; });
      viewer.src = '/models/' + filename.split('/').map(encodeURIComponent).join('/');
    }
  </script>
</body>
</html>
