<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload model</title>
  <style>
    body {
      max-width: 560px;
      margin: 60px auto;
      padding: 0 24px;
      background: #eee;
      color: #222;
      font: 16px system-ui, sans-serif;
    }

    input, button {
      display: block;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Upload model</h1>
  <p>Choose a file up to 50 MB. An existing file with the same name will be replaced. The viewer supports GLB and glTF; related texture and buffer files can also be uploaded here.</p>
  <form>
    <input type="file" required aria-label="Model or supporting file">
    <button>Upload</button>
  </form>
  <p id="status" role="status"></p>
  <a id="view" hidden>View model</a>
  <script>
    const MAX_UPLOAD_BYTES = 50_000_000;
    const form = document.querySelector('form');
    const fileInput = document.querySelector('input');
    const status = document.querySelector('#status');
    const link = document.querySelector('#view');
    const button = document.querySelector('button');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const file = fileInput.files[0];
      link.hidden = true;

      // Give immediate feedback; the server independently enforces this limit.
      if (!file || file.size > MAX_UPLOAD_BYTES) {
        status.textContent = 'Choose a file no larger than 50 MB.';
        return;
      }

      // Prevent duplicate submissions until the request finishes.
      button.disabled = true;
      status.textContent = 'Uploading…';

      try {
        // The API accepts raw file bytes, rather than a multipart form body.
        const response = await fetch('/upload?filename=' + encodeURIComponent(file.name), {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: file,
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || 'Upload failed.');
        }

        status.textContent = 'Uploaded ' + result.filename;
        // Supporting buffers/textures can upload, but cannot open in the viewer.
        link.href = '/?model=' + encodeURIComponent(result.filename);
        link.hidden = !/\.(glb|gltf)$/i.test(result.filename);
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
