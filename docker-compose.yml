services:
  viewer:
    build: .
    image: ${VIEWER_IMAGE:-model-preview:latest}
    environment:
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:8090}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_PASSWORD_FILE: "${ADMIN_PASSWORD_FILE:-}"
    env_file:
      - .env
    ports:
      - "${PORT:-8090}:80"
    volumes:
      - type: bind
        source: ${MODELS_DIR:-./models}
        target: /srv/models
      - type: bind
        source: ${AUTH_DIR:-./auth-data}
        target: /data/auth
    restart: unless-stopped
