version: "3.8"

services:
  viewer:
    image: ${VIEWER_IMAGE:-model-preview:latest}
    environment:
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:8090}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_PASSWORD_FILE: "${ADMIN_PASSWORD_FILE:-}"
    ports:
      - target: 80
        published: ${PORT:-8080}
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: ${MODELS_DIR:-/srv/model-preview/models}
        target: /srv/models
      - type: bind
        source: ${AUTH_DIR:-/srv/model-preview/auth-data}
        target: /data/auth
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.model-preview == true
      restart_policy:
        condition: any
    stop_grace_period: 30s
